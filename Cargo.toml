[workspace]
members = ["crates/buildar", "crates/buildar-quest", "crates/skate-lite-sys", "crates/roomtone-sys", "crates/engine-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Bevy's default features, spelled out so the Quest crate can pick the
# NativeActivity glue instead of the default GameActivity (only one may be
# enabled). Identical to `default` on desktop.
bevy = { version = "=0.18.1", default-features = false, features = [
    "default_app", "2d_bevy_render", "3d_bevy_render", "ui_api", "ui_bevy_render",
    "scene", "audio", "picking",
    "std", "android_shared_stdcxx", "bevy_gilrs", "bevy_winit", "default_font",
    "multi_threaded", "webgl2", "x11", "wayland", "sysinfo_plugin",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The engine contract: https://github.com/rhythmerc/buildar-engine-core (Bevy-free; engine-api wraps it for Bevy).
engine-core = { git = "https://github.com/rhythmerc/buildar-engine-core", rev = "1d66ba37ca305a637ba547fb77aa389539bee9c8" }
# The Skate 3 engine's simulation: https://github.com/rhythmerc/skate3-headless (Bevy-free; the app renders).
# Bump all four revs together; its engine-core rev must be the one above. To build against a local checkout instead,
# uncomment the [patch] block below.
skate3-sim = { git = "https://github.com/rhythmerc/skate3-headless", rev = "66de7f1bdf7d9709188503eef6ce34e2694250c0" }
skate-core = { git = "https://github.com/rhythmerc/skate3-headless", rev = "66de7f1bdf7d9709188503eef6ce34e2694250c0" }
skate-data = { git = "https://github.com/rhythmerc/skate3-headless", rev = "66de7f1bdf7d9709188503eef6ce34e2694250c0" }
# Skate 3 as the engine contract, over the sim.
skate3-engine = { git = "https://github.com/rhythmerc/skate3-headless", rev = "66de7f1bdf7d9709188503eef6ce34e2694250c0" }
# The THUG2 engine: https://github.com/rhythmerc/thug2-headless (thug2-decomp run headless, its C API and THUG2 as the
# engine contract; built with CMake, its decomp a pinned submodule). Bump both revs together; its engine-core rev must
# be the one above.
thug2-sys = { git = "https://github.com/rhythmerc/thug2-headless", rev = "215c0be18c9eed0e4c563a8eb0eb0631ff78900d" }
thug2-engine = { git = "https://github.com/rhythmerc/thug2-headless", rev = "215c0be18c9eed0e4c563a8eb0eb0631ff78900d" }
# The Mario Kart Wii engine: https://github.com/rhythmerc/mkw-headless (the game as the engine contract, over the
# player's own disc recompiled by WiiCompiled; no game data). Its engine-core rev must be the one above; its brres-sys,
# patched below, at the same rev.
mkw-engine = { git = "https://github.com/rhythmerc/mkw-headless", rev = "5f3d6368ea0f0532f2f5fb7bb717873c915876d5" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

# Local buildar-engine-core checkout (a sibling of this repo):
# [patch."https://github.com/rhythmerc/buildar-engine-core"]
# engine-core = { path = "../buildar-engine-core" }

# Local mkw-headless checkout (a sibling of this repo; and brres-sys from it, below):
# [patch."https://github.com/rhythmerc/mkw-headless"]
# mkw-engine = { path = "../mkw-headless/rust/mkw-engine" }

# Local thug2-headless checkout (a sibling of this repo; its decomp: a thug2-decomp checkout beside it, or its submodule):
# [patch."https://github.com/rhythmerc/thug2-headless"]
# thug2-sys = { path = "../thug2-headless/rust/thug2-sys" }
# thug2-engine = { path = "../thug2-headless/rust/thug2-engine" }

# Local skate3-headless checkout (a sibling of this repo):
# [patch."https://github.com/rhythmerc/skate3-headless"]
# skate3-sim = { path = "../skate3-headless/sim" }
# skate3-engine = { path = "../skate3-headless/engine" }
# skate-core = { path = "../skate3-headless/skate-core" }
# skate-data = { path = "../skate3-headless/skate-data" }
# skate-audio-formats = { path = "../skate3-headless/skate-audio-formats" }
# skate-audio-core = { path = "../skate3-headless/skate-audio-core" }

[patch.crates-io]
# (MKWii's model reader, with its C strings typed for arm64: mkw-headless's third_party/brres-sys/BUILDAR.md)
brres-sys = { git = "https://github.com/rhythmerc/mkw-headless", rev = "5f3d6368ea0f0532f2f5fb7bb717873c915876d5" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
winit = { path = "vendor/winit" }
