[workspace]
members = ["crates/skate-game", "crates/skate-quest", "crates/skate-lite-sys", "crates/roomtone-sys", "crates/skate3-engine", "crates/engine-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Bevy's default features, spelled out so the Quest crate can pick the
# NativeActivity glue instead of the default GameActivity (only one may be
# enabled). Identical to `default` on desktop.
bevy = { version = "=0.18.1", default-features = false, features = [
    "default_app", "2d_bevy_render", "3d_bevy_render", "ui_api", "ui_bevy_render",
    "scene", "audio", "picking",
    "std", "android_shared_stdcxx", "bevy_gilrs", "bevy_winit", "default_font",
    "multi_threaded", "webgl2", "x11", "wayland", "sysinfo_plugin",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The engine contract: https://github.com/rhythmerc/buildar-engine-core (Bevy-free; engine-api wraps it for Bevy).
engine-core = { git = "https://github.com/rhythmerc/buildar-engine-core", rev = "1da95abb6dc14ea3d6cc72f8964014f8a1d24678" }
# The Skate 3 engine's simulation: https://github.com/rhythmerc/skate3-headless (Bevy-free; the app renders).
# Bump all three revs together. To build against a local checkout instead, uncomment the [patch] block below.
skate3-sim = { git = "https://github.com/rhythmerc/skate3-headless", rev = "ff026ef823fcafaa818e6313d8e54e61e2bdf652" }
skate-core = { git = "https://github.com/rhythmerc/skate3-headless", rev = "ff026ef823fcafaa818e6313d8e54e61e2bdf652" }
skate-data = { git = "https://github.com/rhythmerc/skate3-headless", rev = "ff026ef823fcafaa818e6313d8e54e61e2bdf652" }
# The THUG2 engine: https://github.com/rhythmerc/thug2-headless (thug2-decomp run headless, its C API and THUG2 as the
# engine contract; built with CMake, its decomp a pinned submodule). Bump both revs together; its engine-core rev must
# be the one above.
thug2-sys = { git = "https://github.com/rhythmerc/thug2-headless", rev = "1a59863c362c2b5fa2b9aefedaaf32c56651693c" }
thug2-engine = { git = "https://github.com/rhythmerc/thug2-headless", rev = "1a59863c362c2b5fa2b9aefedaaf32c56651693c" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

# Local buildar-engine-core checkout (a sibling of this repo):
# [patch."https://github.com/rhythmerc/buildar-engine-core"]
# engine-core = { path = "../buildar-engine-core" }

# Local thug2-headless checkout (a sibling of this repo; its decomp: a thug2-decomp checkout beside it, or its submodule):
# [patch."https://github.com/rhythmerc/thug2-headless"]
# thug2-sys = { path = "../thug2-headless/rust/thug2-sys" }
# thug2-engine = { path = "../thug2-headless/rust/thug2-engine" }

# Local skate3-headless checkout (a sibling of this repo):
# [patch."https://github.com/rhythmerc/skate3-headless"]
# skate3-sim = { path = "../skate3-headless/sim" }
# skate-core = { path = "../skate3-headless/skate-core" }
# skate-data = { path = "../skate3-headless/skate-data" }
# skate-audio-formats = { path = "../skate3-headless/skate-audio-formats" }
# skate-audio-core = { path = "../skate3-headless/skate-audio-core" }

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
winit = { path = "vendor/winit" }
