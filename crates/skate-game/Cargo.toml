[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "skate_game"
path = "src/lib.rs"

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[features]
default = ["dev-dynamic", "retail"]
dev-dynamic = ["bevy/dynamic_linking"]
# The imported-disc tier: the faithful port of the retail game, run on the player's own converted
# Skate 3 data, and its importer. The headset app (crates/skate-quest) has it; without it the crate is
# the app layer and the clean-room engine alone (what CI type-checks).
retail = [
    "dep:tracing-log", "dep:skate3-sim", "dep:skate-core", "dep:skate-data", "dep:zip",
    "zip/deflate-flate2-zlib-rs",
]
# OpenXR passthrough mode (`--xr`); the Quest build always enables it.
xr = ["dep:gltf", "dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr", "dep:roomtone-sys", "dep:wgpu", "dep:wgpu-hal", "dep:ash"]
# THUG2's own engine (thug2-sys: thug2-decomp run headless) as a third engine in the headset, on the player's own
# game files. Builds the engine with CMake from the thug2-headless and thug2-decomp checkouts (crates/thug2-sys).
thug2 = ["xr", "dep:thug2-sys", "dep:thug2-engine"]
# Desktop XR keeps a mirror window beside the headset view.
xr-window = ["xr", "bevy_mod_openxr/window_support"]

[dependencies]
engine-api = { path = "../engine-api" }
engine-core.workspace = true
bevy = { workspace = true, features = ["jpeg", "trace", "debug"] }
tracing-log = { version = "0.2", optional = true }
# (the controllers' shapes come from the headset as glTF: xr::controller_shapes)
gltf = { version = "1.4", default-features = false, optional = true }
# The Bevy-free Skate 3 simulation (skate3-headless).
skate3-sim = { workspace = true, optional = true }
skate-core = { workspace = true, optional = true }
skate-data = { workspace = true, optional = true }
serde_json.workspace = true
# Steam Audio (libphonon.so) is loaded at run time, if it is there (src/binaural.rs).
libloading = "0.8"
serde.workspace = true
skate-lite-sys = { path = "../skate-lite-sys" }
thug2-sys = { path = "../thug2-sys", optional = true }
# THUG2's side of the engine contract (its HUD's parts), Bevy-free; moves to thug2-headless with thug2-sys.
thug2-engine = { path = "../thug2-engine", optional = true }
# Room light estimation for the passthrough mode (xr::room_light).
roomtone-sys = { path = "../roomtone-sys", optional = true }

bevy_mod_openxr = { version = "=0.5.0", optional = true, features = ["fb_passthrough"] }
bevy_mod_xr = { version = "=0.5.0", optional = true }
openxr = { version = "0.21.1", optional = true }
# The headset's depth images wrapped as textures (`xr::occlusion`), as bevy_mod_openxr wraps its swapchain's.
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan"], optional = true }
wgpu-hal = { version = "=27.0.4", default-features = false, features = ["vulkan"], optional = true }
ash = { version = "0.38", optional = true }
# Unzips an imported Skate 3 bundle in the headset (xr::ui::import; retail only).
zip = { version = "6", optional = true, default-features = false }

# Game pads on Quest come through the (vendored, patched) winit Android backend: xr::actions.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false }
# The passthrough camera for room lighting (xr::room_light::camera): the NDK's
# Camera2 and image reader. The version android-activity already brings in.
ndk-sys = { version = "0.6", features = ["media"] }

[dev-dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
